<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Midnight Purple / Navy -->
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Wood / Gold Box Base Gradient -->
    <linearGradient id="mb-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Box Lid / Accent Gold Gradient -->
    <linearGradient id="mb-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Metal Comb Tines Gradient -->
    <linearGradient id="mb-silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#mb-bg)" />

  <!-- Inner subtle border highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" ry="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Sheet Music Staff Lines in upper backdrop -->
  <path d="M 28 32 H 100 M 28 38 H 100 M 28 44 H 100 M 28 50 H 100" stroke="#CBD5E1" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round" />

  <!-- Floating Musical Eighth Note rising from box -->
  <g fill="url(#mb-gold)">
    <path d="M 72 26 C 72 26, 82 22, 92 27 V 44 C 92 44, 84 41, 74 46 V 26 Z" />
    <circle cx="70" cy="48" r="6" />
    <circle cx="88" cy="46" r="6" />
    <rect x="72" y="26" width="3" height="22" />
    <rect x="90" y="27" width="3" height="19" />
  </g>

  <!-- Winding Key (Crank Handle) on Right Side of Box -->
  <g stroke="url(#mb-gold)" stroke-width="3" fill="none">
    <path d="M 96 82 H 108" />
    <circle cx="111" cy="82" r="5" fill="url(#mb-gold)" />
  </g>

  <!-- Music Box Body -->
  <!-- Main Box Front -->
  <rect x="24" y="66" width="72" height="36" rx="6" fill="url(#mb-box)" stroke="#451A03" stroke-width="1.5" />
  
  <!-- Lid Top Edge -->
  <rect x="20" y="60" width="80" height="9" rx="3" fill="url(#mb-gold)" />

  <!-- Mechanical Comb / Tines inside / on front -->
  <g fill="url(#mb-silver)">
    <rect x="36" y="74" width="3" height="18" rx="1.5" />
    <rect x="42" y="74" width="3" height="21" rx="1.5" />
    <rect x="48" y="74" width="3" height="15" rx="1.5" />
    <rect x="54" y="74" width="3" height="23" rx="1.5" />
    <rect x="60" y="74" width="3" height="17" rx="1.5" />
    <rect x="66" y="74" width="3" height="20" rx="1.5" />
    <rect x="72" y="74" width="3" height="14" rx="1.5" />
    <rect x="78" y="74" width="3" height="19" rx="1.5" />
  </g>

  <!-- Cylinder Pins (Dots) -->
  <g fill="#FDE047">
    <circle cx="37.5" cy="80" r="1" />
    <circle cx="43.5" cy="88" r="1" />
    <circle cx="49.5" cy="78" r="1" />
    <circle cx="55.5" cy="91" r="1" />
    <circle cx="61.5" cy="82" r="1" />
    <circle cx="67.5" cy="85" r="1" />
    <circle cx="73.5" cy="77" r="1" />
    <circle cx="79.5" cy="89" r="1" />
  </g>

  <!-- Sparkle stars floating around note -->
  <path d="M 38 34 L 40 38 L 44 40 L 40 42 L 38 46 L 36 42 L 32 40 L 36 38 Z" fill="#FDE047" opacity="0.8" />
  <path d="M 98 18 L 99.5 21 L 102.5 22.5 L 99.5 24 L 98 27 L 96.5 24 L 93.5 22.5 L 96.5 21 Z" fill="#FDE047" opacity="0.8" />
</svg>
