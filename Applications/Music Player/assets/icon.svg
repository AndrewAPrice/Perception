<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark sleek tile gradient -->
    <linearGradient id="mp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Play button gradient -->
    <linearGradient id="mp-play-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Equalizer bar gradient -->
    <linearGradient id="mp-eq-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#mp-bg)" />

  <!-- Inner subtle border highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" ry="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Equalizer / Waveform spectrum bars in background -->
  <g opacity="0.95">
    <rect x="24" y="68" width="6" height="24" rx="3" fill="url(#mp-eq-grad)" />
    <rect x="34" y="56" width="6" height="36" rx="3" fill="url(#mp-eq-grad)" />
    <rect x="44" y="46" width="6" height="46" rx="3" fill="url(#mp-eq-grad)" />
    <rect x="54" y="60" width="6" height="32" rx="3" fill="url(#mp-eq-grad)" />
    <rect x="64" y="42" width="6" height="50" rx="3" fill="url(#mp-eq-grad)" />
    <rect x="74" y="52" width="6" height="40" rx="3" fill="url(#mp-eq-grad)" />
    <rect x="84" y="64" width="6" height="28" rx="3" fill="url(#mp-eq-grad)" />
    <rect x="94" y="74" width="6" height="18" rx="3" fill="url(#mp-eq-grad)" />
  </g>

  <!-- Circular Play Button Badge -->
  <circle cx="64" cy="46" r="21" fill="url(#mp-play-grad)" filter="url(#glow)" />

  <!-- Play Icon Triangle -->
  <path d="M 57 36.5 L 75 46 L 57 55.5 Z" fill="#FFFFFF" />

  <!-- Waveform line connecting front -->
  <path d="M 20 86 Q 36 76 52 86 T 84 86 T 108 86" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.6" />
</svg>
